name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          # 检测可用的 Xcode 版本
          xcode_paths=(/Applications/Xcode*.app)
          for p in "${xcode_paths[@]}"; do
            echo "Found: $p"
          done
          # 使用最新的 Xcode
          LATEST=$(ls -t /Applications/Xcode*.app 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST/Contents/Developer"
            echo "Using: $LATEST"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Build for device (arm64, no signing)
        run: |
          set -x
          xcodebuild \
            -project MercedesSim.xcodeproj \
            -scheme MercedesSim \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=$RUNNER_TEMP/build \
            clean build
          echo "Build succeeded"

      - name: Package IPA
        run: |
          set -x
          APP_DIR="$RUNNER_TEMP/build/MercedesSim.app"
          mkdir -p "$RUNNER_TEMP/ipa"
          # 创建空的 _CodeSignature 目录（不写 CodeResources，避免冲突）
          mkdir -p "$APP_DIR/_CodeSignature"
          # 打包 IPA
          cd "$APP_DIR/.."
          zip -r -X "$RUNNER_TEMP/ipa/MercedesSim.ipa" MercedesSim.app
          echo "IPA created: $(du -h "$RUNNER_TEMP/ipa/MercedesSim.ipa" | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MercedesSim
          path: "$RUNNER_TEMP/ipa/MercedesSim.ipa"
