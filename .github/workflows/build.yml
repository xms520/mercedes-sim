name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build Release
        run: |
          set -x
          xcodebuild \
            -project MercedesSim.xcodeproj \
            -scheme MercedesSim \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build" \
            clean build
          echo "Build succeeded"

      - name: Clean and fix Info.plist
        run: |
          set -x
          APP="$RUNNER_TEMP/build/MercedesSim.app"
          
          # 删除所有签名相关文件和目录
          rm -rf "$APP/_CodeSignature"
          rm -f "$APP/embedded.mobileprovision"
          rm -f "$APP/PkgInfo"
          
          # 删除调试 dylib
          rm -f "$APP/__preview.dylib"
          rm -f "$APP/*.debug.dylib"
          rm -f "$APP/*.dylib"
          
          # 修复 Info.plist - 移除 Xcode 版本信息
          python3 << 'PYTHON_EOF'
          import plistlib
          import os
          
          plist_path = os.environ['APP_PATH'] + '/Info.plist'
          with open(plist_path, 'rb') as f:
              plist = plistlib.load(f)
          
          # 移除可能导致兼容性问题的字段
          plist.pop('BuildMachineOSBuild', None)
          plist.pop('DTCompiler', None)
          plist.pop('DTPlatformBuild', None)
          plist.pop('DTPlatformName', None)
          plist.pop('DTPlatformVersion', None)
          plist.pop('DTSDKBuild', None)
          plist.pop('DTSDKName', None)
          plist.pop('DTXcode', None)
          plist.pop('DTXcodeBuild', None)
          
          with open(plist_path, 'wb') as f:
              plistlib.dump(plist, f)
          
          print("Fixed Info.plist")
          PYTHON_EOF
          
          export APP_PATH="$APP"
          python3 -c "
          import plistlib, os
          plist_path = '$APP/Info.plist'
          with open(plist_path, 'rb') as f:
              plist = plistlib.load(f)
          for key in ['BuildMachineOSBuild', 'DTCompiler', 'DTPlatformBuild', 'DTPlatformName', 'DTPlatformVersion', 'DTSDKBuild', 'DTSDKName', 'DTXcode', 'DTXcodeBuild']:
              plist.pop(key, None)
          with open(plist_path, 'wb') as f:
              plistlib.dump(plist, f)
          print('Info.plist cleaned')
          "
          
          # 确保 UIRequiredDeviceCapabilities 正确
          python3 -c "
          import plistlib
          plist_path = '$APP/Info.plist'
          with open(plist_path, 'rb') as f:
              plist = plistlib.load(f)
          plist['UIRequiredDeviceCapabilities'] = ['arm64']
          with open(plist_path, 'wb') as f:
              plistlib.dump(plist, f)
          print('Device capabilities set to arm64')
          "
          
          echo "Cleaned app directory:"
          ls -la "$APP/"

      - name: Package IPA
        run: |
          set -x
          APP_DIR="$RUNNER_TEMP/build/MercedesSim.app"
          mkdir -p "$RUNNER_TEMP/ipa"
          cd "$APP_DIR/.."
          zip -r -X "$RUNNER_TEMP/ipa/MercedesSim.ipa" MercedesSim.app
          echo "IPA created: $(du -h "$RUNNER_TEMP/ipa/MercedesSim.ipa" | cut -f1)"
          echo "IPA_PATH=$RUNNER_TEMP/ipa/MercedesSim.ipa" >> $GITHUB_ENV

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MercedesSim
          path: ${{ env.IPA_PATH }}
