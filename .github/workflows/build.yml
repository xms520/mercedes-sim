name: Build MercedesSim

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build for Simulator (arm64)
        run: |
          xcodebuild \
            -project MercedesSim.xcodeproj \
            -scheme MercedesSim \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find build -name "MercedesSim.app" -type d | head -1)
          echo "App bundle: $APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa
          zip -qr ../MercedesSim.ipa Payload
          cd ..
          ls -lh MercedesSim.ipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MercedesSim
          path: MercedesSim.ipa
