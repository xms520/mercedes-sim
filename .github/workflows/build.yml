name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Build for device (arm64)
        run: |
          set -x
          xcodebuild \
            -project MercedesSim.xcodeproj \
            -scheme MercedesSim \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=$RUNNER_TEMP/build \
            clean build
          echo "Build succeeded"

      - name: Package IPA
        run: |
          set -x
          APP_DIR="$RUNNER_TEMP/build/MercedesSim.app"
          mkdir -p "$RUNNER_TEMP/ipa"
          # 创建空 _CodeSignature 目录（避免全能签误判）
          mkdir -p "$APP_DIR/_CodeSignature"
          cd "$APP_DIR/.."
          zip -r -X "$RUNNER_TEMP/ipa/MercedesSim.ipa" MercedesSim.app
          echo "IPA created: $(du -h "$RUNNER_TEMP/ipa/MercedesSim.ipa" | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MercedesSim
          path: "$RUNNER_TEMP/ipa/MercedesSim.ipa"
