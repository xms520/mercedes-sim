name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          xcode_paths=($(ls -t /Applications/Xcode*.app 2>/dev/null))
          if [ ${#xcode_paths[@]} -gt 0 ]; then
            sudo xcode-select -s "${xcode_paths[0]}/Contents/Developer"
            echo "Using: ${xcode_paths[0]}"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Build for device (arm64, no signing)
        run: |
          set -x
          xcodebuild \
            -project MercedesSim.xcodeproj \
            -scheme MercedesSim \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=$RUNNER_TEMP/build \
            clean build
          echo "Build succeeded"

      - name: Package IPA
        run: |
          set -x
          APP_DIR="$RUNNER_TEMP/build/MercedesSim.app"
          mkdir -p "$RUNNER_TEMP/ipa"
          mkdir -p "$APP_DIR/_CodeSignature"
          cd "$APP_DIR/.."
          zip -r -X "$RUNNER_TEMP/ipa/MercedesSim.ipa" MercedesSim.app
          echo "IPA created: $(du -h "$RUNNER_TEMP/ipa/MercedesSim.ipa" | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MercedesSim
          path: "$RUNNER_TEMP/ipa/MercedesSim.ipa"
