name: Build MercedesSim

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # 第一步：无签名构建（成功过）
      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project MercedesSim.xcodeproj \
            -scheme MercedesSim \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # 第二步：创建占位 CodeSignature（让 IPA 结构完整）
      - name: Create placeholder CodeSignature
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData \
            -name "MercedesSim.app" -type d 2>/dev/null | head -1)
          echo "App: $APP"
          mkdir -p "$APP/_CodeSignature"
          # 创建最小有效 CodeResources
          python3 << 'EOF'
          import plistlib, os, hashlib
          app = os.environ.get('APP_PATH', '')
          if not app:
              import subprocess
              result = subprocess.run(['find', '/Users/runner/Library/Developer/Xcode/DerivedData', 
                                       '-name', 'MercedesSim.app', '-type', 'd'], 
                                     capture_output=True, text=True)
              app = result.stdout.strip().split('\n')[0]
          
          cr_path = os.path.join(app, '_CodeSignature', 'CodeResources')
          data = {
              'files': {},
              'files2': {},
              'rules': {},
              'rulestree': {}
          }
          with open(cr_path, 'wb') as f:
              plistlib.dump(data, f)
          print(f"Created CodeResources at {cr_path}")
          EOF
          export APP_PATH="$APP"
          python3 << 'EOF'
          import plistlib, os, subprocess
          result = subprocess.run(['find', '/Users/runner/Library/Developer/Xcode/DerivedData', 
                                   '-name', 'MercedesSim.app', '-type', 'd'], 
                                 capture_output=True, text=True)
          app = result.stdout.strip().split('\n')[0]
          cr_path = os.path.join(app, '_CodeSignature', 'CodeResources')
          data = {'files': {}, 'files2': {}, 'rules': {}, 'rulestree': {}}
          with open(cr_path, 'wb') as f:
              plistlib.dump(data, f)
          print(f"Created: {cr_path}")
          EOF

      # 第三步：打包 IPA
      - name: Package IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData \
            -name "MercedesSim.app" -type d 2>/dev/null | head -1)
          echo "App bundle: $APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa
          zip -qr ../MercedesSim.ipa Payload
          cd ..
          ls -lh MercedesSim.ipa
          echo "CodeSignature present: $([ -d 'Payload/MercedesSim.app/_CodeSignature' ] && echo YES || echo NO)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MercedesSim
          path: MercedesSim.ipa
