name: Build MercedesSim

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # 第一步：生成有效的占位签名（使 IPA 结构完整）
      - name: Build & Ad-hoc Sign (placeholder)
        run: |
          xcodebuild \
            -project MercedesSim.xcodeproj \
            -scheme MercedesSim \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      # 第二步：从 DerivedData 打包 IPA
      - name: Package IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData \
            -name "MercedesSim.app" -type d 2>/dev/null | head -1)
          echo "App bundle: $APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa
          zip -qr ../MercedesSim.ipa Payload
          cd ..
          ls -lh MercedesSim.ipa
          # 验证 CodeSignature 存在
          unzip -l Payload/MercedesSim.app/_CodeSignature >/dev/null 2>&1 \
            && echo "CodeSignature: OK" || echo "CodeSignature: MISSING"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MercedesSim
          path: MercedesSim.ipa
