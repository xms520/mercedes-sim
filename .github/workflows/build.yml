name: Build Mercedes Simulator iOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build with Xcode
        run: |
          xcodebuild \
            -project mercedesSim.xcodeproj \
            -scheme mercedesSim \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'name=iPhone 15 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        run: |
          APP_PATH=$(find build/Release-iphonesimulator -name "mercedesSim.app" -type d | head -1)
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r ../MercedesSim.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MercedesSim
          path: MercedesSim.ipa
