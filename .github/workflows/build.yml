name: Build MercedesSim

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for device (arm64, unsigned)
        run: |
          xcodebuild \
            -project MercedesSim.xcodeproj \
            -scheme MercedesSim \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find build -name "MercedesSim.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find . -name "MercedesSim.app" -type d | grep -v ".xcodeproj" | head -1)
          fi
          echo "App bundle: $APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa
          zip -qr ../MercedesSim.ipa Payload
          cd ..
          ls -lh MercedesSim.ipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MercedesSim
          path: MercedesSim.ipa
