name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Build Release for device
        run: |
          set -x
          BUILD_DIR="$RUNNER_TEMP/build"
          xcodebuild \
            -project MercedesSim.xcodeproj \
            -scheme MercedesSim \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            clean build
          echo "Build succeeded"
          ls -la "$BUILD_DIR/MercedesSim.app/"

      - name: Clean debug artifacts
        run: |
          set -x
          APP="$RUNNER_TEMP/build/MercedesSim.app"
          echo "Cleaning debug artifacts from: $APP"
          ls -la "$APP/" | grep -i "dylib\|debug" || echo "No debug files found"
          rm -f "$APP/__preview.dylib"
          rm -f "$APP/MercedesSim.debug.dylib"
          rm -rf "$APP/_CodeSignature"
          echo "Cleaned. Remaining files:"
          ls -la "$APP/"

      - name: Package IPA
        run: |
          set -x
          APP_DIR="$RUNNER_TEMP/build/MercedesSim.app"
          mkdir -p "$RUNNER_TEMP/ipa"
          cd "$APP_DIR/.."
          zip -r -X "$RUNNER_TEMP/ipa/MercedesSim.ipa" MercedesSim.app
          echo "IPA created: $(du -h "$RUNNER_TEMP/ipa/MercedesSim.ipa" | cut -f1)"
          echo "IPA_PATH=$RUNNER_TEMP/ipa/MercedesSim.ipa" >> $GITHUB_ENV

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MercedesSim
          path: ${{ env.IPA_PATH }}
